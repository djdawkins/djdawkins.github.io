<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc"><title id="title">Slater request sequence</title><desc id="desc">The transport authenticates a request, the core resolves an authorized capability view, builds bounded context, calls the local model, validates and executes a tool, then returns a result for transport-specific rendering.</desc><defs><style>.lane{stroke:#cfd3d3;stroke-width:1}.box{fill:#fbfaf7;stroke:#9ca7b1}.model{fill:#dfe7f8;stroke:#2457c5}.t{font:600 14px system-ui,sans-serif;fill:#17212b}.s{font:12px system-ui,sans-serif;fill:#5d6873}.line{stroke:#66737f;stroke-width:1.5;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#66737f"/></marker></defs><g><text x="80" y="34" class="t">Transport</text><text x="290" y="34" class="t">API / store</text><text x="495" y="34" class="t">Chat core</text><text x="700" y="34" class="t">Registry</text><text x="905" y="34" class="t">Local model</text><path d="M112 50v380M322 50v380M527 50v380M732 50v380M937 50v380" class="lane"/></g><path d="M112 82H322" class="line"/><text x="154" y="74" class="s">authenticated request</text><path d="M322 128H527" class="line"/><text x="355" y="120" class="s">query + bounded history</text><path d="M527 174H732" class="line"/><text x="563" y="166" class="s">forSubject(subject)</text><path d="M732 220H527" class="line"/><text x="552" y="212" class="s">authorized tools + context</text><path d="M527 266H937" class="line"/><text x="670" y="258" class="s">prompt + tool definitions</text><path d="M937 312H527" class="line"/><text x="666" y="304" class="s">tool call or answer</text><path d="M527 350H732" class="line"/><text x="547" y="342" class="s">validate + execute tool</text><path d="M732 388H527" class="line"/><text x="554" y="380" class="s">result + sources / facts / action</text><path d="M527 426H112" class="line"/><text x="200" y="418" class="s">transport-shaped response · persisted outcome</text><rect x="856" y="238" width="162" height="94" rx="8" class="model"/><text x="883" y="278" class="t">max 4 steps</text><text x="876" y="301" class="s">900 tokens / step</text></svg>
