<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">Slater current architecture</title><desc id="desc">Web, voice, and MCP clients connect to one Express API and chat core. The core uses an authorized capability registry, a local model, SQLite, and a household integration API.</desc><defs><style>.box{fill:#fbfaf7;stroke:#9ca7b1;stroke-width:1.5}.dark{fill:#17212b;stroke:#17212b}.soft{fill:#dfe7f8;stroke:#2457c5}.planned{fill:#fbfaf7;stroke:#9ca7b1;stroke-dasharray:7 6}.t{font:600 15px system-ui,sans-serif;fill:#17212b}.s{font:12px system-ui,sans-serif;fill:#5d6873}.w{fill:#fff}.line{stroke:#66737f;stroke-width:1.7;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 6}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0l10 5-10 5z" fill="#66737f"/></marker></defs><text x="45" y="38" class="s">CLIENTS</text><rect x="45" y="58" width="180" height="72" rx="8" class="box"/><text x="67" y="87" class="t">React web UI</text><text x="67" y="110" class="s">text · sources · live view</text><rect x="45" y="152" width="180" height="72" rx="8" class="box"/><text x="67" y="181" class="t">iPhone Shortcut</text><text x="67" y="204" class="s">spoken request · rich reply</text><rect x="45" y="246" width="180" height="72" rx="8" class="box"/><text x="67" y="275" class="t">MCP client</text><text x="67" y="298" class="s">authenticated machine ingress</text><text x="330" y="38" class="s">APPLICATION</text><rect x="330" y="58" width="360" height="260" rx="12" class="dark"/><text x="360" y="94" class="t w">Express API · one instance per environment</text><rect x="360" y="120" width="300" height="72" rx="8" class="soft"/><text x="385" y="150" class="t">Transport-agnostic chat core</text><text x="385" y="173" class="s">bounded prompt + model/tool loop</text><rect x="360" y="214" width="300" height="72" rx="8" class="box"/><text x="385" y="244" class="t">Capability registry</text><text x="385" y="267" class="s">subject-scoped tools · rules · context</text><text x="785" y="38" class="s">CAPABILITIES &amp; SERVICES</text><rect x="785" y="58" width="250" height="72" rx="8" class="soft"/><text x="810" y="87" class="t">Security capability</text><text x="810" y="110" class="s">3 tools · digest · validation</text><rect x="785" y="152" width="250" height="72" rx="8" class="planned"/><text x="810" y="181" class="t">Finance / Health</text><text x="810" y="204" class="s">tested contracts · not registered</text><rect x="785" y="246" width="250" height="72" rx="8" class="box"/><text x="810" y="275" class="t">Household integration API</text><text x="810" y="298" class="s">camera events · media · structured data</text><rect x="330" y="400" width="220" height="82" rx="8" class="box"/><text x="355" y="433" class="t">Local model gateway</text><text x="355" y="458" class="s">OpenAI-compatible · egress policy</text><rect x="590" y="400" width="220" height="82" rx="8" class="box"/><text x="615" y="433" class="t">Owner-scoped SQLite</text><text x="615" y="458" class="s">threads · sessions · retry ledger</text><rect x="330" y="520" width="480" height="62" rx="8" class="box"/><text x="355" y="548" class="t">Production / development isolation</text><text x="355" y="570" class="s">separate process · database · credentials · cookies · origins</text><path d="M225 94H330M225 188H330M225 282H330M660 250H785M910 130v22M910 224v22M510 318v82M610 318l78 82M570 482v38" class="line"/><path d="M785 188H700" class="line dash"/></svg>
