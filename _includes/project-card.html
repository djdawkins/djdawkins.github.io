<article class="project-card{% if include.featured %} project-card--featured{% endif %}">
  <div class="project-card__top">
    <p class="eyebrow">{{ include.type }}</p>
    {% if include.status %}<span class="status">{{ include.status }}</span>{% endif %}
  </div>
  <h3><a href="{{ include.url | relative_url }}">{{ include.title }}</a></h3>
  <p>{{ include.description }}</p>
  {% if include.tags %}
    <ul class="tag-list" aria-label="Technologies and themes">
      {% assign tags = include.tags | split: ',' %}
      {% for tag in tags %}<li>{{ tag | strip }}</li>{% endfor %}
    </ul>
  {% endif %}
  <a class="text-link" href="{{ include.url | relative_url }}">Read case study <span aria-hidden="true">→</span></a>
</article>
